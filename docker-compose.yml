# Local test only (mirrors the Railway template). Not used by Railway.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: localtest-db-pass
      POSTGRES_DB: nocobase
    volumes: [db:/var/lib/postgresql/data]
  nocobase:
    build: .
    depends_on: [postgres]
    environment:
      APP_KEY: localtest-app-key-0123456789abcdef
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: localtest-db-pass
      INIT_ROOT_EMAIL: admin@example.com
      INIT_ROOT_PASSWORD: localtest-root-pass
    ports: ["80"]
    volumes: [storage:/app/nocobase/storage]
volumes:
  db: {}
  storage: {}
